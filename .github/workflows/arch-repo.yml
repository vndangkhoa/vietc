name: Arch Linux Pacman Repository

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-arch-repo:
    name: Build Pacman Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Pacman repository in Arch Linux container
        run: |
          mkdir -p dist/arch/x86_64
          bash packaging/arch-repo/build-repo.sh

      - name: Deploy Pacman repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Upload Arch package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arch/x86_64/*.pkg.tar.zst
