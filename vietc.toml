input_method = "vni"
toggle_key = "space"
toggle_method_key = "shift"
start_enabled = true
grab = false
debug = false
# Ubuntu GNOME Wayland: auto-enable native IBus engine where
# zwp_input_method_v2 is unavailable (Mutter). Mirrors Funput's
# strategy: be an IBus engine. Set false to force legacy path.
auto_ibus = true
ibus_engine = false
controller_mode = false

[auto_restore]
enabled = true
trigger_keys = [
    "space",
    "escape",
]

[app_state]
enabled = true
english_apps = [
    "code",
    "jetbrains",
    "intellij",
    "pycharm",
    "webstorm",
    "vim",
    "nvim",
    "kitty",
    "alacritty",
    "foot",
    "ghostty",
]
vietnamese_apps = [
    "telegram",
    "discord",
    "slack",
    "firefox",
    "chromium",
    "thunderbird",
    "gedit",
    "gnome-text-editor",
    "org.gnome.TextEditor",
]
terminal_apps = [
    "terminal",
    "kitty",
    "alacritty",
    "foot",
    "wezterm",
    "konsole",
    "gnome-terminal",
    "gnome-terminal-server",
    "ptyxis",
    "kgx",
    "st",
    "urxvt",
    "xterm",
    "terminator",
    "tilix",
]
bypass_apps = [
    "steam",
    "dota",
    "csgo",
    "minecraft",
    "factorio",
]
terminal_input_method = "vni"

[macros]
bt = "biết"
vs = "với"
kc = "không có"
dc = "được"
ko = "không"
rd = "rất"
nk = "như"
"ko dc" = "không được"
lm = "làm"
ng = "người"
